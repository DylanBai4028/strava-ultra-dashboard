[project]
name = "strava-ultra-dashboard"
version = "0.1.0"
description = "A local pipeline that turns your Strava training history into a self-hosted ultramarathon training dashboard — load tracking, race readiness, and more."
authors = [
    { name = "Dylan Bai" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
